name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build
      - name: Compile node-free darwin binaries
        run: |
          bun build --compile --target=bun-darwin-arm64 dist/index.js --outfile solti-darwin-arm64
          bun build --compile --target=bun-darwin-x64 dist/index.js --outfile solti-darwin-x64
      - name: Package tarballs (binary at archive root)
        run: |
          mkdir -p stage
          cp solti-darwin-arm64 stage/solti && tar -czf solti-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz -C stage solti
          cp solti-darwin-x64 stage/solti && tar -czf solti-${GITHUB_REF_NAME#v}-darwin-x64.tar.gz -C stage solti
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release with brew tarballs
        run: gh release create "${{ github.ref_name }}" solti-*.tar.gz --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
